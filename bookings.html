<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking-royal stay hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Royal Stay Hotel</a>
            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html"> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rooms.html">Rooms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="bookings.html">Bookings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="booking-section py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h1>Book Your Room</h1>
                <p class="text-muted">
                    Fill in the details below to reserve your room.
                </p>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow border-0">
                        <div class="card-body p-4 p-md-5">
                            <form id="bookingForm">
                                <div class="mb-3">
                                    <label for="guestName"class="form-label">Guest Name</label>
                                    <input type="text"class="form-control"id="guestName"placeholder="Enter your name">
                                </div>
                                <div class="mb-3">
                                    <label for="email"class="form-label">Email</label>
                                    <input type="email"class="form-control"id="email"placeholder="Enter your email">
                                </div> 
                                <div class=" mb-3">
                                    <label for="roomType"class="form-label">Room Type</label>
                                    <select id="roomType" class="form-select">
                                        <option value="">Select Room Type</option>
                                        <option value="deluxe">Deluxe Room</option>
                                        <option value="suite">Suite Room</option>
                                        <option value="family">Family Room</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="checkin"class="form-label">Check-in</label>
                                        <input type="date"class="form-control"id="checkin">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="checkout"class="form-label">Check-out</label>
                                        <input type="date"class="form-control"id="checkout">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="guests"class="form-label">Guests</label>
                                    <input type="number"class="form-control"id="guests"min="1"placeholder="Number of guests">
                                </div>
                                <div class="d-grid">
                                    <button type="button"class="btn btn-primary" id="bookBtn">Book Room</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="booking-table-section py-5">
    <div class="container">
        <div class="text-center mb-4">
            <h2>Booking Details</h2>
            <p class="text-muted">
                Recent room booking information
            </p>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Guest Name</th>
                        <th>Email</th>
                        <th>Room Type</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Guests</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                </tbody>
            </table>
        </div>
    </div>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <script src="script.js"></script>
</body>
</html>
